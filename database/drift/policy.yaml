# Drift policy for membership database module.
# Schema aligns with sdkwork-specs/DATABASE_FRAMEWORK_SPEC.md section 9.2 and
# the sdkwork-database-spi DriftPolicyFile/DriftPolicyRules contract.
#
# Severity defaults match the drift engine defaults, preserving the previous
# module policy behavior:
#   - error: missing_table, missing_column, type_mismatch, missing_constraint,
#            migration_pending, migration_unknown, checksum_mismatch
#   - warn:  extra_table, extra_column, missing_index
#   - info:  extra_index
#
# Reference-only tables owned by other commerce modules (order/payment) share
# this schema. They are not part of the membership contract, so drift reports
# them as `extra_table` at warn severity only and never block drift-check.

schemaVersion: 1
kind: sdkwork.database.drift-policy

rules:
  # Tables excluded from drift comparison (foreign migration trackers).
  ignoreTables:
    - "_prisma_migrations"
    - "schema_migrations"
    - "flyway_schema_history"

  # Columns excluded from drift comparison (table.column notation).
  ignoreColumns: []

  # Severity overrides for specific drift patterns.
  severityOverrides:
    # Reference-only commerce tables stay informational/warn (engine default).
    extra_table: warn
    extra_column: warn
    missing_index: warn
    extra_index: info
